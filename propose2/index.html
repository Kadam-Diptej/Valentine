<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Still You 😏💍</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
          margin:0;
          height:100vh;
          font-family:'Poppins',sans-serif;
          background: linear-gradient(135deg,#ff9a9e,#fbc2eb,#a6c1ee);
          display:flex;
          align-items:center;
          justify-content:center;
          overflow:hidden;
        }

        .box {
          background: rgba(255,255,255,0.96);
          padding:40px;
          border-radius:22px;
          text-align:center;
          max-width:380px;
          box-shadow:0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
          color:#6a0572;
          margin-bottom:15px;
        }

        p {
          line-height:1.6;
          margin-bottom:20px;
          color:#444;
        }

        img {
          width:220px;
          border-radius:16px;
          margin-bottom:20px;
        }

        button {
          padding:12px 26px;
          border-radius:30px;
          border:none;
          font-size:1rem;
          margin:8px;
          cursor:pointer;
          transition:transform 0.2s ease, box-shadow 0.2s ease;
        }

        #yes {
          background:#ff4d6d;
          color:white;
        }

        #no {
          background:#6c757d;
          color:white;
        }

        button:hover {
          transform:scale(1.05);
          box-shadow:0 6px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

<div class="box">
    <h1 id="title">I was thinking… 😏💍</h1>

    <p id="text">
        We’ve lived at least 7 births together.<br>
        Seen the best. Seen the worst.<br>
        Fought over nonsense. Made up anyway 😌<br><br>
        And somehow… I still choose you.
    </p>

    <!-- Landing GIF (soft waiting + thinking vibe) -->
    <img id="gif"
         src="https://media1.tenor.com/m/LHXKjhLyaZEAAAAC/superbad-look-around.gif"
         alt="thinking love gif">

    <div>
        <button id="yes">Still choose you ❤️</button>
        <button id="no">Any escape? 😏</button>
    </div>
</div>

<script>
    const title = document.getElementById("title");
    const text  = document.getElementById("text");
    const gif   = document.getElementById("gif");

    document.getElementById("yes").onclick = () => {
      title.textContent = "No regrets. Unfortunately 😌💍";
      text.innerHTML = `
        Knowing everything…<br>
        every fight, every laugh,<br>
        every “I’m fine” moment 😏<br><br>
        I’d still marry you again ❤️
      `;
      gif.src = "https://media1.tenor.com/m/bDnLivil00YAAAAC/pokemon-poke-ball.gif";
    };

    document.getElementById("no").onclick = () => {
      title.textContent = "Nice try 😏";
      text.innerHTML = `
        Sorry 😌<br>
        No refunds. No exchanges.<br>
        Lifetime contract renewed 💍<br><br>
        You’re stuck with me ❤️
      `;
      gif.src = "https://media1.tenor.com/m/wgC8wrOQ6LcAAAAd/escape-stuck.gif";
    };
</script>

</body>
</html>
