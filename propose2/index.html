<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No Refunds 😏💍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0;
    height:100vh;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  .box {
    background: rgba(255,255,255,0.95);
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:90%;
    position:relative;
    z-index:1;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }

  h1 { color:#e63946; }
  p { line-height:1.6; }

  button {
    padding:12px 25px;
    border-radius:30px;
    border:none;
    font-size:1.05rem;
    margin:8px;
    cursor:pointer;
  }
  #yes { background:#ff4d6d; color:white; }
  #no { background:#495057; color:white; }

  /* Floating hearts */
  .heart {
    position:absolute;
    font-size:24px;
    animation:floatUp 5s linear forwards;
    pointer-events:none;
  }

  @keyframes floatUp {
    0% { transform:translateY(0) scale(1); opacity:1; }
    100% { transform:translateY(-110vh) scale(1.5); opacity:0; }
  }

  img { width:200px; border-radius:15px; margin:20px 0; }
</style>
</head>
<body>

<div class="box">
  <h1 id="title">Serious Question 😏💍</h1>
  <p id="text">
    7 births. Countless fights.<br>
    “I’m fine” arguments.<br>
    Still married. Still alive.<br><br>
    Knowing all this…
  </p>

  <img id="gif" src="https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif" alt="funny married gif">

  <div>
    <button id="yes">Still choose you 😌</button>
    <button id="no">Any escape? 😏</button>
  </div>
</div>

<script>
const title=document.getElementById("title");
const text=document.getElementById("text");

document.getElementById("yes").onclick=()=>{
  title.textContent="No regrets. Unfortunately 😏❤️";
  text.innerHTML=`No refunds.<br>No exchanges.<br>Lifetime contract renewed 💍<br><br>I’d still marry you again ❤️`;
  spawnHearts();
};

document.getElementById("no").onclick=()=>{
  text.innerHTML=`Sorry 😌<br>Contract signed across all 7 births.<br>You’re stuck with me 💍`;
};

// Floating hearts function
function spawnHearts() {
  setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.textContent="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=Math.random()*20+20+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  },300);
}
</script>

</body>
</html>
