<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Be My Valentine 💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Comic Sans MS', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            color: #e63946;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        img {
            width: 250px;
            max-width: 80%;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .buttons {
            position: relative;
            height: 80px;
        }

        button {
            font-size: 1.1rem;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.5);
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            position: absolute;
            background-color: #adb5bd;
            color: #333;
        }

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1 id="title">Will you be my Valentine? 💖</h1>

    <img id="gif"
         src="https://media1.tenor.com/m/PZj7MRgBFbMAAAAd/will-you-be-my-valentine-valentines-day.gif"
         alt="Begging eyes" />

    <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 😐</button>
    </div>
</div>

<div class="hearts" id="hearts"></div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const gif = document.getElementById("gif");
    const title = document.getElementById("title");
    const heartsContainer = document.getElementById("hearts");

    // Make "No" button run away
    noBtn.addEventListener("mouseenter", () => {
        const container = document.querySelector(".container");
        const containerRect = container.getBoundingClientRect();

        const maxX = containerRect.width - noBtn.offsetWidth;
        const maxY = containerRect.height - noBtn.offsetHeight;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    });

    // YES button behavior
    yesBtn.addEventListener("click", () => {

        title.innerHTML = `
            Happy Valentine's Day! 💖<br><br>
            Thanks for being my Valentine…<br>
            even though we both know you got the better deal! 😌❤️<br>
            Thanks for being my emergency contact,<br>
            for making my heart race (mostly when you ride 😵),<br>
            and for surviving my daily levels of annoying.<br><br>
            I love you more today than yesterday…<br>
            which is impressive, because yesterday, you were really annoying (just kidding).<br><br>
        `;

        gif.src = "https://media1.tenor.com/m/ElGUz9zaST4AAAAd/shark-tank-mr-wonderful.gif";

        noBtn.style.display = "none";
        yesBtn.style.display = "none";

        startHearts();
    });

    // Floating hearts animation
    function startHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.textContent = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }, 300);
    }
</script>

</body>

</html>
