<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Still You 😌💍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
    }
    h1 { color: #6a0572; }
    p { line-height: 1.6; }
    button {
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-size: 1.05rem;
      margin: 8px;
      cursor: pointer;
    }
    #yes { background: #ff4d6d; color: white; }
    #no { background: #adb5bd; }
  </style>
</head>
<body>

<div class="box">
  <h1 id="title">I was thinking… 🤔💍</h1>
  <p id="text">
    We’ve lived at least 7 births together.<br>
    Seen the best. Seen the worst 😌<br>
    And somehow… I still smile every day.
  </p>

  <button id="yes">Still choose you ❤️</button>
  <button id="no">You already did 😏</button>
</div>

<script>
  const title = document.getElementById("title");
  const text = document.getElementById("text");

  document.getElementById("yes").onclick = () => {
    title.textContent = "Last birth. Same choice 😌💖";
    text.innerHTML = `
      Knowing everything…<br>
      every fight, every laugh,<br>
      I’d still marry you again ❤️
    `;
  };

  document.getElementById("no").onclick = () => {
    text.innerHTML = `
      True 😌<br>
      But I’ll still keep choosing you.
    `;
  };
</script>

</body>
</html>
